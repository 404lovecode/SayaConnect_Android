name: Dicky HDR Studio - Build Android APK
on:
  push:
    branches: [dicky-hdr-apk-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract Dicky HDR Studio project
        run: unzip -q dicky-hdr-android-project.zip
      - name: Build installable APK
        working-directory: dicky-hdr-android
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dicky-HDR-Studio-APK
          path: dicky-hdr-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
