name: Android debug APK (SayaConnect)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew'
      - '*.gradle.kts'
      - '.github/workflows/android-debug.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android API 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Firebase Android config
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo 'Missing repository secret GOOGLE_SERVICES_JSON_B64' >&2
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > app/google-services.json
      # IMPORTANT for phone sign-in: use the same debug signing key across CI builds,
      # and register its SHA-1/SHA-256 in Firebase Console. A new random CI key each run
      # causes SMS verification to fail on many installed APKs.
      - name: Restore stable debug signing key for Firebase phone auth
        env:
          ANDROID_DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$ANDROID_DEBUG_KEYSTORE_B64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$ANDROID_DEBUG_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
          else
            echo 'WARNING: ANDROID_DEBUG_KEYSTORE_B64 is absent. Phone verification needs SHA fingerprints of each actual APK signing key.'
          fi
      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SayaConnect-v3-email-optional-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
