/** Invite-only friend picker. 2–3 invited friends = 3–4 people total. */
@Composable 
fun GroupCallPicker(friends: List<Friend>, ui: String, onDismiss: () -> Unit,
onStart: (List<Friend>, Boolean) -> Unit) {
    val selected = remember { mutableStateListOf<String>() }
    var voiceOnly by remember { mutableStateOf(false) }
    AlertDialog(
        onDismissRequest = onDismiss,
        title = { Text(t("Start a group call", ui)) },
        text = {
            Column(Modifier.heightIn(max = 420.dp)) {
                Text(t("Select 2–3 friends · Up to 4 participants", ui),
                    style = MaterialTheme.typography.bodySmall)
                Spacer(Modifier.height(12.dp))
                Row(verticalAlignment = Alignment.CenterVertically) {
                    RadioButton(selected = !voiceOnly, onClick = { voiceOnly = false })
                    Text("🎥 " + t("Video", ui), Modifier.clickable { voiceOnly = false })
                    Spacer(Modifier.width(18.dp))
                    RadioButton(selected = voiceOnly, onClick = { voiceOnly = true })
                    Text("🎙️ " + t("Voice", ui), Modifier.clickable { voiceOnly = true })
                }
                HorizontalDivider()
                Column(Modifier.verticalScroll(rememberScrollState())) {
                    friends.forEach { friend ->
                        Row(Modifier.fillMaxWidth().clickable {
                            if (friend.uid in selected) selected.remove(friend.uid)
                            else if (selected.size < 3) selected.add(friend.uid)
                        }.padding(vertical = 7.dp), verticalAlignment = Alignment.CenterVertically) {
                            Checkbox(checked = friend.uid in selected, onCheckedChange = { checked ->
                                if (checked && selected.size < 3) selected.add(friend.uid)
                                if (!checked) selected.remove(friend.uid)
                            })
                            Column {
                                Text(friend.displayName, fontWeight = FontWeight.SemiBold)
                                Text("@${friend.username}", style = MaterialTheme.typography.bodySmall)
                            }
                        }
                    }
                }
                Text("${selected.size} / 3 friends selected",
                    style = MaterialTheme.typography.bodySmall)
            }
        },
        confirmButton = {
            Button(onClick = { onStart(friends.filter { it.uid in selected }, voiceOnly) },
                enabled = selected.size in 2..3) { Text(t("Start call", ui)) }
        },
        dismissButton = { TextButton(onClick = onDismiss) { Text(t("Cancel", ui)) } }
    )
}

@Composable
fun GroupCallScreen(repo: ConnectRepository, settings: SettingsStore, original: GroupCallInfo,
                    onClose: () -> Unit, onError: (Throwable) -> Unit) {
    val context = androidx.compose.ui.platform.LocalContext.current
    val scope = rememberCoroutineScope()
    var room by remember(original.id) { mutableStateOf(original) }
    var micOn by remember(original.id) { mutableStateOf(true) }
    var videoOn by remember(original.id) { mutableStateOf(original.mode == "video") }
    var showEmojis by remember { mutableStateOf(false) }
    var reactions by remember(original.id) { mutableStateOf(emptyList<String>()) }
    val peerStatuses = remember(original.id) { mutableStateMapOf<String, String>() }
    val session = remember(original.id) {
        GroupRtcSession(context, original.id, repo.uid, settings.lowData, original.mode == "audio",
            onPeerStatus = { id, state -> peerStatuses[id] = state },
            onError = { message -> onError(IllegalStateException(message)) })
    }
    var leaving by remember { mutableStateOf(false) }
    fun leave() {
        if (leaving) return
        leaving = true
        scope.launch {
            try { kotlinx.coroutines.withTimeout(4000L) { repo.leaveGroupCall(room) } }
            catch (t: Throwable) { onError(t) }
            finally { onClose() }
        }
    }
    BackHandler { leave() }
    DisposableEffect(session) {
        val watcher = repo.observeGroupCall(original.id) { latest ->
            if (latest == null || latest.status == "ended" ||
                latest.memberStates[repo.uid] != "joined") {
                onClose()
            } else {
                room = latest
                session.syncJoined(latest.memberStates.filterValues { it == "joined" }.keys)
            }
        }
        val reactionWatcher = repo.observeGroupReactions(original.id) { reactions = it }
        onDispose { watcher.remove(); reactionWatcher.remove(); session.dispose() }
    }
    val otherJoined = room.members.filter { it != repo.uid && room.memberStates[it] == "joined" }
    val invited = room.members.count { room.memberStates[it] == "invited" }
    val tiles = listOf(repo.uid) + otherJoined

    Column(Modifier.fillMaxSize().background(wallpaperBrush("Midnight")).padding(14.dp),
        horizontalAlignment = Alignment.CenterHorizontally) {
        Text("SAYACONNECT  •  GROUP ${if (original.mode == "audio") "VOICE" else "VIDEO"}",
            color = Color.White.copy(alpha = .8f), fontSize = 12.sp,
            fontWeight = FontWeight.Bold)
        Spacer(Modifier.height(5.dp))
        Text("${tiles.size} joined • $invited invited", color = Color.White, fontSize = 15.sp)
        if (settings.lowData) Text("📶 Low data mode", color = Color.White.copy(alpha = .75f),
            fontSize = 12.sp)
        Spacer(Modifier.height(14.dp))
        Column(Modifier.weight(1f), verticalArrangement = Arrangement.spacedBy(10.dp)) {
            tiles.chunked(2).forEach { row ->
                Row(Modifier.fillMaxWidth().weight(1f), horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                    row.forEach { id ->
                        val mine = id == repo.uid
                        val name = if (mine) t("You", settings.uiLanguage) else room.names[id] ?: "Friend"
                        val status = if (mine) (if (micOn) "Microphone on" else "Muted")
                        else peerStatuses[id] ?: "Connecting"
                        Box(Modifier.weight(1f).fillMaxHeight().clip(RoundedCornerShape(20.dp))
                            .background(Color(0xFF1F304B))) {
                            if (original.mode == "video") {
                                AndroidView(
                                    factory = { c -> SurfaceViewRenderer(c).also { v ->
                                        if (mine) session.attachLocal(v) else session.attachRemote(id, v)
                                    } },
                                    onRelease = { v ->
                                        if (mine) session.detachLocal(v) else session.detachRemote(id, v)
                                    },
                                    modifier = Modifier.fillMaxSize()
                                )
                            } else {
                                Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                                    Text(name.take(1).uppercase(), color = Color.White,
                                        fontSize = 54.sp, fontWeight = FontWeight.Bold)
                                }
                            }
                            Column(Modifier.align(Alignment.BottomStart).fillMaxWidth()
                                .background(Color(0xAA18253C)).padding(8.dp)) {
                                Text(name, color = Color.White, fontWeight = FontWeight.Bold,
                                    maxLines = 1, overflow = TextOverflow.Ellipsis)
                                Text(status, color = Color.White.copy(alpha = .8f), fontSize = 11.sp,
                                    maxLines = 1)
                            }
                        }
                    }
                    if (row.size == 1) Spacer(Modifier.weight(1f))
                }
            }
        }
        if (invited > 0) Text(t("Waiting for friends to accept the invitation…", settings.uiLanguage),
            color = Color.White.copy(alpha = .77f), fontSize = 12.sp,
            modifier = Modifier.padding(7.dp))
        if (reactions.isNotEmpty()) Text(reactions.joinToString("  "), fontSize = 26.sp)
        if (showEmojis) {
            Row(Modifier.padding(vertical = 8.dp), horizontalArrangement = Arrangement.spacedBy(13.dp)) {
                listOf("❤️", "😂", "👏", "🔥", "🥰", "🙏").forEach { emoji ->
                    Text(emoji, Modifier.clickable {
                        showEmojis = false
                        scope.launch { try { repo.sendGroupReaction(original.id, emoji) }
                        catch (e: Exception) { onError(e) } }
                    }, fontSize = 26.sp)
                }
            }
        }
        Spacer(Modifier.height(12.dp))
        Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceEvenly) {
            GroupControl(if (micOn) Icons.Default.Mic else Icons.Default.MicOff, t("Mic", settings.uiLanguage)) {
                micOn = session.toggleMic()
            }
            if (original.mode == "video") {
                GroupControl(if (videoOn) Icons.Default.Videocam else Icons.Default.VideocamOff,
                    t("Camera", settings.uiLanguage)) { videoOn = session.toggleCamera() }
                GroupControl(Icons.Default.Cameraswitch, t("Flip", settings.uiLanguage)) { session.switchCamera() }
            }
            GroupControl(Icons.Default.EmojiEmotions, t("React", settings.uiLanguage)) { showEmojis = !showEmojis }
        }
        Spacer(Modifier.height(15.dp))
        Button(onClick = { leave() }, enabled = !leaving,
            modifier = Modifier.fillMaxWidth(.67f).height(52.dp),
            colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFE34A69))) {
            Icon(Icons.Default.CallEnd, null)
            Spacer(Modifier.width(8.dp))
            Text(t(if (room.host == repo.uid) "End group call" else "Leave call", settings.uiLanguage))
        }
        Spacer(Modifier.height(9.dp))
    }
}

@Composable
private fun GroupControl(image: androidx.compose.ui.graphics.vector.ImageVector, label: String, click: () -> Unit) {
    Column(horizontalAlignment = Alignment.CenterHorizontally) {
        Box(Modifier.size(52.dp).clip(CircleShape).background(Color(0xBB33415F))
            .clickable(onClick = click), contentAlignment = Alignment.Center) {
            Icon(image, label, tint = Color.White)
        }
        Text(label, color = Color.White, fontSize = 11.sp)
    }
}
